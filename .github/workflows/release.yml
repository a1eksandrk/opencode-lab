name: Release plugin

on:
  push:
    tags:
      - 'model-fallback/v*'
      - 'model-whitelist/v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.validate.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Validate tag and package version
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(model-fallback|model-whitelist)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag such as model-whitelist/v1.0.0" >&2
            exit 1
          fi
          plugin="${RELEASE_TAG%%/*}"
          version="${RELEASE_TAG#*/v}"
          package_version="$(bun -e 'console.log(require(process.argv[1]).version)' "./plugins/$plugin/package.json")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match $plugin package version $package_version" >&2
            exit 1
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLUGIN: ${{ needs.check.outputs.plugin }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --latest=false \
            --notes "Release of $PLUGIN. See plugins/$PLUGIN/README.md for installation and configuration."
